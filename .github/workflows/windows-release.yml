name: Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - run: npm run typecheck && npm test && npm run package:windows
      - run: npm run package:installer
      - uses: actions/upload-artifact@v4
        with:
          name: VN-Pochta-Windows
          path: |
            release/*.exe
            release/*.sha256
            release/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*.exe release/*.zip release/*.sha256
          --verify-tag --title "VN ПОЧТА $GITHUB_REF_NAME"
          --notes-file installer/RELEASE-NOTES.md
